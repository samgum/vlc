name: VLC Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  GIT_SUBMODULE_FLAGS: --recurse-submodules

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew update
        brew install autoconf automake cmake libtool pkg-config gettext ninja python3 yasm lua@5.3 luajit || true

    - name: Build VLC using official script
      run: |
        ./extras/package/macosx/build.sh -a x86_64 -i z -x
      continue-on-error: true

    - name: Show build artifacts
      if: always()
      run: |
        echo "=== Looking for build artifacts ==="
        find . -name "*.dmg" -o -name "*.tar.gz" -o -name "vlc" -type f 2>/dev/null | head -20

    - name: Upload VLC artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vlc-macos-${{ github.sha }}
        path: |
          *.dmg
          *.tar.gz
        retention-days: 30
        if-no-files-found: ignore

  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: registry.videolan.org/vlc-debian-unstable:20260217105256
      options: --user root

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Fix Git ownership issue
      run: |
        git config --global --add safe.directory /__w/vlc/vlc

    - name: Build VLC (official method)
      run: |
        export NCPU=$(nproc)
        echo "Building VLC using official method"
        echo "Branch: ${GITHUB_REF_NAME}"
        echo ""
        ./bootstrap
        ./configure
        make -j$NCPU

    - name: Show build info
      if: always()
      run: |
        echo "=== VLC binary location ==="
        find . -name "vlc" -type f -executable 2>/dev/null | head -10

    - name: Upload VLC binary
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vlc-ubuntu-${{ github.sha }}
        path: src/vlc
        retention-days: 30

  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: registry.videolan.org/vlc-debian-win64-posix:20260127163923
      options: --user root

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build VLC (official method)
      run: |
        export TRIPLET=x86_64-w64-mingw32
        export HOST_ARCH=x86_64
        ./extras/package/win32/build.sh -a x86_64 -x
      continue-on-error: true
      timeout-minutes: 120

    - name: Show build results
      if: always()
      run: |
        echo "=== Windows build artifacts ==="
        ls -la win64/ 2>/dev/null || echo "No win64 directory"
        find . -name "*.exe" -o -name "*.dll" 2>/dev/null | head -20

    - name: Upload Windows artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vlc-windows-${{ github.sha }}
        path: |
          win64/*.exe
          win64/*.dll
          win64/*.7z
        retention-days: 30
        if-no-files-found: ignore
