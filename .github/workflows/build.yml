name: VLC Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  GIT_SUBMODULE_FLAGS: --recurse-submodules

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew update
        brew install autoconf automake cmake libtool pkg-config gettext ninja python3 yasm lua@5.3 luajit || true

    - name: Build VLC using official script
      run: |
        ./extras/package/macosx/build.sh -a x86_64 -i z -x
      continue-on-error: true

    - name: Show build artifacts
      if: always()
      run: |
        echo "=== Looking for build artifacts ==="
        find . -name "*.dmg" -o -name "*.tar.gz" -o -name "vlc" -type f 2>/dev/null | head -20

    - name: Upload VLC artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vlc-macos-${{ github.sha }}
        path: |
          *.dmg
          *.tar.gz
        retention-days: 30
        if-no-files-found: ignore

  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake build-essential cmake libtool pkg-config yasm gettext ninja-build python3 liblua5.2-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libvorbis-dev libogg-dev libflac-dev libxml2-dev libass-dev

    - name: Build VLC
      run: |
        ./bootstrap
        ./configure --disable-nls --disable-qt --disable-skins2
        make -j$(nproc)
      continue-on-error: true

    - name: Show build info
      if: always()
      run: |
        echo "=== Looking for VLC binary ==="
        find . -name "vlc" -type f -executable 2>/dev/null | head -10

    - name: Upload VLC binary
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vlc-ubuntu-${{ github.sha }}
        path: src/vlc
        retention-days: 30
        if-no-files-found: warn

  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install MinGW cross-compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y mingw-w64 mingw-w64-tools mingw-w64-x86-64-dev g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64

    - name: Install other dependencies
      run: |
        sudo apt-get install -y autoconf automake cmake libtool pkg-config yasm gettext ninja-build python3 git wine

    - name: Build contrib (optional, takes long)
      run: |
        echo "Building VLC for Windows using cross-compilation"
        echo "This may take 1-2 hours..."
      continue-on-error: true

    - name: Try official Windows build script
      run: |
        export TRIPLET=x86_64-w64-mingw32
        export HOST_ARCH=x86_64
        ./extras/package/win32/build.sh -a x86_64 -x 2>&1 | tee build.log || true
      continue-on-error: true
      timeout-minutes: 120

    - name: Show build results
      if: always()
      run: |
        echo "=== Checking for Windows build artifacts ==="
        ls -la win64/ 2>/dev/null || echo "No win64 directory"
        find . -name "*.exe" -o -name "*.dll" 2>/dev/null | head -20
        echo ""
        echo "=== Build log (last 50 lines) ==="
        tail -50 build.log 2>/dev/null || echo "No build log"

    - name: Upload Windows artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vlc-windows-${{ github.sha }}
        path: |
          win64/*.exe
          win64/*.dll
          win64/*.7z
          build.log
        retention-days: 30
        if-no-files-found: ignore
