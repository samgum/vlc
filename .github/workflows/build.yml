name: VLC Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  GIT_SUBMODULE_FLAGS: --recurse-submodules

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew update
        brew install autoconf automake cmake libtool pkg-config gettext ninja python3 yasm lua53 luajit

    - name: Build VLC using official script
      run: |
        ./extras/package/macosx/build.sh -a x86_64 -i z -x
      continue-on-error: true

    - name: Show build artifacts
      if: always()
      run: |
        echo "=== Looking for build artifacts ==="
        find . -name "*.dmg" -o -name "*.tar.gz" -o -name "vlc" -type f 2>/dev/null | head -20

    - name: Upload VLC artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vlc-macos-${{ github.sha }}
        path: |
          *.dmg
          *.tar.gz
        retention-days: 30
        if-no-files-found: ignore

  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake build-essential cmake libtool pkg-config yasm gettext ninja-build python3 liblua5.2-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libvorbis-dev libogg-dev libflac-dev libxml2-dev libass-dev

    - name: Build VLC
      run: |
        ./bootstrap
        ./configure --disable-nls --disable-qt --disable-skins2
        make -j$(nproc)
      continue-on-error: true

    - name: Show build info
      if: always()
      run: |
        echo "=== Looking for VLC binary ==="
        find . -name "vlc" -type f -executable 2>/dev/null | head -10

    - name: Upload VLC binary
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vlc-ubuntu-${{ github.sha }}
        path: src/vlc
        retention-days: 30
        if-no-files-found: warn

  build-windows-info:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Windows build info
      run: |
        echo "VLC Windows builds require MinGW cross-compilation"
        echo "See: https://wiki.videolan.org/Compile_VLC_on_Windows"
        echo "For official builds: https://www.videolan.org/vlc/"
