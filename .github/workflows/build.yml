name: VLC Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  GIT_SUBMODULE_FLAGS: --recurse-submodules

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        brew update
        brew install autoconf automake cmake libtool pkg-config \
                     gettext ninja python3 yasm \
                     lua53 luajit 2>&1 | tail -10

    - name: Build VLC using official script
      run: |
        ./extras/package/macosx/build.sh -a x86_64 -i z -x
      continue-on-error: true

    - name: Show build artifacts
      if: always()
      run: |
        ls -la *.dmg *.tar.gz 2>/dev/null || echo "No artifacts found"

    - name: Upload VLC artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vlc-macos-${{ github.sha }}
        path: |
          *.dmg
          *.tar.gz
        retention-days: 30
        if-no-files-found: ignore

  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: registry.videolan.org/vlc-debian-unstable:20260121072258
      options: --user root

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build VLC
      run: |
        export NCPU=$(nproc)
        ./bootstrap
        ./configure --disable-nls --disable-qt --disable-skins2
        make -j$NCPU 2>&1 | tail -50

    - name: Show build info
      if: always()
      run: |
        ls -lh src/vlc 2>/dev/null || echo "Build failed"
        file src/vlc 2>/dev/null || echo "Binary not found"

    - name: Upload VLC binary
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vlc-ubuntu-${{ github.sha }}
        path: src/vlc
        retention-days: 30

  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: registry.videolan.org/vlc-debian-win64-posix:20260127163923
      options: --user root

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build VLC using official script
      run: |
        ./extras/package/win32/build.sh -a x86_64 -x
      continue-on-error: true

    - name: Show build artifacts
      if: always()
      run: |
        ls -la win64/*.exe win64/*.7z 2>/dev/null || echo "No artifacts found"

    - name: Upload VLC artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vlc-windows-${{ github.sha }}
        path: |
          win64/*.exe
          win64/*.7z
        retention-days: 30
        if-no-files-found: ignore
